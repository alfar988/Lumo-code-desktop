name: Build Lumo Code Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "windows-desktop/**"
      - ".github/workflows/build-lumo-windows.yml"
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python for packaging
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run bootstrap unit tests
        run: python -m unittest discover -s windows-desktop -p "test_*.py" -v

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build bootstrap executable
        run: pyinstaller --noconfirm --clean --onefile --console --name LumoBootstrap windows-desktop/bootstrap.py

      - name: Smoke-test bootstrap executable
        run: .\dist\LumoBootstrap.exe --help

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build setup installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows-desktop\LumoCode.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumoCode-Windows-Setup
          path: dist/LumoCode-Setup.exe
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LumoCode-Setup.exe
